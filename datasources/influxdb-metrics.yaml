apiVersion: influxdb.datasource.grafana.app/v0alpha1
kind: DataSource
metadata:
  name: influxdb-metrics
  labels:
    team: platform
    env: staging
spec:
  title: InfluxDB (Flux)
  access: proxy
  url: http://influxdb.monitoring.svc:8086
  jsonData:
    version: Flux
    organization: grafana
    defaultBucket: telemetry
    httpMode: POST
    timeInterval: 10s
secure:
  token:
    create: fake-influx-token-not-a-real-credential
    description: InfluxDB API token
