apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: dash-00563
spec:
  title: Dashboard 00563
  schemaVersion: 39
  tags:
    - demo
    - gitsync
  time:
    from: now-6h
    to: now
  panels:
    - type: timeseries
      title: Requests / sec
      gridPos:
        h: 8
        w: 12
        x: 0
        y: 0
      targets:
        - refId: A
          expr: rate(http_requests_total[5m])
