apiVersion: playlist.grafana.app/v1
kind: Playlist
metadata:
  name: noc-wall-display
  namespace: default
  labels:
    team: noc
    display: wallboard
spec:
  title: NOC Wall Display
  interval: 15s
  items:
    - type: dashboard_by_tag
      value: critical
    - type: dashboard_by_uid
      value: global-status
    - type: dashboard_by_uid
      value: incident-overview
    - type: dashboard_by_tag
      value: sla
