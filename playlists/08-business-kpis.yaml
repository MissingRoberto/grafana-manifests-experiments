apiVersion: playlist.grafana.app/v1
kind: Playlist
metadata:
  name: business-kpis
  namespace: default
  labels:
    team: product
    domain: business
spec:
  title: Business KPIs
  interval: 10m
  items:
    - type: dashboard_by_tag
      value: kpi
    - type: dashboard_by_uid
      value: revenue-overview
    - type: dashboard_by_uid
      value: active-users
