apiVersion: playlist.grafana.app/v1
kind: Playlist
metadata:
  name: infra-overview
  namespace: default
  labels:
    team: platform
    rotation: noc
spec:
  title: Infrastructure Overview
  interval: 5m
  items:
    - type: dashboard_by_tag
      value: infrastructure
    - type: dashboard_by_tag
      value: kubernetes
    - type: dashboard_by_uid
      value: node-exporter-full
