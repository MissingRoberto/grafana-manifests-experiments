apiVersion: playlist.grafana.app/v1
kind: Playlist
metadata:
  name: database-health
  namespace: default
  labels:
    team: data
    domain: databases
spec:
  title: Database Health
  interval: 1m
  items:
    - type: dashboard_by_uid
      value: postgres-overview
    - type: dashboard_by_uid
      value: mysql-overview
    - type: dashboard_by_uid
      value: redis-metrics
    - type: dashboard_by_tag
      value: database
