apiVersion: playlist.grafana.app/v1
kind: Playlist
metadata:
  name: sre-golden-signals
  namespace: default
  labels:
    team: sre
    methodology: golden-signals
spec:
  title: SRE Golden Signals
  interval: 1m
  items:
    - type: dashboard_by_tag
      value: latency
    - type: dashboard_by_tag
      value: traffic
    - type: dashboard_by_tag
      value: errors
    - type: dashboard_by_tag
      value: saturation
